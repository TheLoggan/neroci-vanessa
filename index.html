<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#f6f3ee;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:14px;
  font-family:Arial,sans-serif;
}

.container{
  width:100%;
  max-width:1600px;
}

.convite{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:24px;
  box-shadow:0 15px 45px rgba(0,0,0,.16);
  background:white;
}

.banner{
  width:100%;
  display:block;
}

.btn-maps{
  position:absolute;
  left:49.1%;
  top:82.2%;
  width:22.2%;
  height:6.2%;
  border-radius:999px;
  z-index:50;
  cursor:pointer;
}

.whatsapp-img{
  position:absolute;
  left:5.2%;
  top:52.8%;
  width:20.8%;
  z-index:60;
  cursor:pointer;
}

.whatsapp-img img{
  width:100%;
  display:block;
}

.pix-area{
  position:absolute;
  right:1.8%;
  top:calc(66% + 1cm);
  width:10%;
  z-index:40;
  text-align:center;
}

.pix-area img{
  width:100%;
  display:block;
  border-radius:4px;
}

.pix-sugestao{
  margin-top:4px;
  color:#0b5d47;
  font-size:clamp(7px,1vw,16px);
  font-weight:bold;
  line-height:1.1;
  white-space:nowrap;
}

.contador-box{
  margin-top:14px;
  background:linear-gradient(135deg,#fff,#fbf7ef);
  border:2px solid #d7b56d;
  border-radius:22px;
  padding:16px;
  text-align:center;
}

.contador-titulo{
  color:#0b5d47;
  font-size:24px;
  font-family:Georgia,serif;
  margin-bottom:14px;
  font-weight:bold;
}

.contador{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.tempo{
  min-width:78px;
  padding:10px 8px;
  border-radius:15px;
  background:linear-gradient(135deg,#0b5d47,#145c49);
  border:2px solid #d7b56d;
  color:white;
}

.tempo strong{
  display:block;
  font-size:24px;
  line-height:1;
}

.tempo span{
  display:block;
  margin-top:5px;
  font-size:10px;
  text-transform:uppercase;
}

@media(max-width:600px){
  body{padding:6px}

  .container{max-width:100%}

  .convite{
    width:100vw;
    margin-left:calc(-50vw + 50%);
    border-radius:10px;
  }

  .contador-box{
    width:94%;
    margin:12px auto 0;
    padding:13px 10px;
    border-radius:18px;
  }

  .contador-titulo{
    font-size:22px;
    line-height:1.15;
    margin-bottom:12px;
  }

  .contador{
    gap:8px;
  }

  .tempo{
    min-width:68px;
    padding:9px 6px;
    border-radius:13px;
  }

  .tempo strong{
    font-size:22px;
  }

  .tempo span{
    font-size:9px;
  }
}
</style>
</head>

<body>
<main class="container">

<div class="convite">

<img src="banner-convite2.png" class="banner" alt="Convite Casamento">

<a class="btn-maps"
href="https://maps.app.goo.gl/XsYa17Ck2yia9vxGA"
target="_blank"
aria-label="Ver localização"></a>

<a class="whatsapp-img"
href="https://wa.me/554791424714?text=Olá!%20Quero%20confirmar%20minha%20presença%20no%20casamento."
target="_blank">
<img src="image(88).png" alt="Confirmar Presença">
</a>

<div class="pix-area">
<img src="qrcode-pix.png" alt="QR Code PIX">
<div class="pix-sugestao">Sugestão de 200,00</div>
</div>

</div>

<section class="contador-box">
<div class="contador-titulo">Faltam para o casamento</div>

<div class="contador">
<div class="tempo"><strong id="dias">0</strong><span>Dias</span></div>
<div class="tempo"><strong id="horas">0</strong><span>Horas</span></div>
<div class="tempo"><strong id="minutos">0</strong><span>Minutos</span></div>
<div class="tempo"><strong id="segundos">0</strong><span>Segundos</span></div>
</div>
</section>

</main>

<script>
const dataCasamento = new Date("2026-11-21T17:00:00-03:00").getTime();

function atualizarContador(){
  const agora = new Date().getTime();
  const distancia = dataCasamento - agora;

  if(distancia <= 0){
    document.querySelector(".contador-titulo").innerHTML = "Chegou o grande dia!";
    return;
  }

  document.getElementById("dias").innerHTML = Math.floor(distancia / (1000*60*60*24));
  document.getElementById("horas").innerHTML = Math.floor((distancia % (1000*60*60*24))/(1000*60*60));
  document.getElementById("minutos").innerHTML = Math.floor((distancia % (1000*60*60))/(1000*60));
  document.getElementById("segundos").innerHTML = Math.floor((distancia % (1000*60))/1000);
}

atualizarContador();
setInterval(atualizarContador,1000);
</script>

</body>
