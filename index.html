<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convite Casamento - Neroci & Vanessa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', serif;
    }

    body {
      background: linear-gradient(135deg, #ffffff, #f7f7f7);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .convite {
      position: relative;
      width: 100%;
      max-width: 1400px;
      background: white;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      border: 3px solid #e6d2a2;
    }

    .topo-floral {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 180px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.95), transparent);
      pointer-events: none;
    }

    .conteudo {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 60px;
      gap: 40px;
    }

    .foto-area {
      flex: 1;
      min-width: 350px;
      position: relative;
    }

    .foto-area img {
      width: 100%;
      max-width: 650px;
      object-fit: contain;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.2));
    }

    .info-area {
      flex: 1;
      min-width: 350px;
      text-align: center;
      color: #2f3a2f;
    }

    .titulo {
      font-size: 5rem;
      color: #c59b3d;
      line-height: 1;
      margin-bottom: 25px;
    }

    .subtitulo {
      font-size: 1.3rem;
      letter-spacing: 4px;
      color: #666;
      margin-bottom: 40px;
    }

    .detalhe {
      margin: 22px 0;
      font-size: 1.8rem;
    }

    .descricao {
      font-size: 1.3rem;
      color: #555;
      margin-top: 8px;
      font-style: italic;
    }

    .botoes {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 45px;
      flex-wrap: wrap;
    }

    .botao {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 34px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: bold;
      transition: 0.3s ease;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      cursor: pointer;
      border: none;
      position: relative;
      z-index: 20;
    }

    .botao-localizacao {
      background: linear-gradient(135deg, #0b5d47, #145c49);
      color: white;
      border: 3px solid #d7b56d;
      border-radius: 60px;
      padding: 18px 38px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      position: relative;
      overflow: hidden;
    }

    .botao-localizacao:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 14px 30px rgba(11,93,71,0.35);
      background: linear-gradient(135deg, #0f7055, #1b7c62);
    }

    .qr-areas {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-top: 60px;
      flex-wrap: wrap;
    }

    .qr-box {
      width: 230px;
      text-align: center;
    }

    .qr-placeholder {
      width: 230px;
      height: 230px;
      border: 3px dashed #d4b06b;
      border-radius: 25px;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c0c0c0;
      font-size: 1.2rem;
      padding: 15px;
    }

    .qr-label {
      margin-top: 14px;
      font-size: 1.2rem;
      color: #5a4a25;
      font-weight: bold;
    }

    .flores {
      position: absolute;
      width: 220px;
      opacity: 0.95;
      pointer-events: none;
    }

    .flor-top-left {
      top: -10px;
      left: -10px;
    }

    .flor-bottom-right {
      bottom: -20px;
      right: -20px;
      transform: rotate(180deg);
    }

    @media (max-width: 900px) {
      .conteudo {
        padding: 35px;
      }

      .titulo {
        font-size: 3.5rem;
      }

      .detalhe {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="convite">
    <div class="topo-floral"></div>

    <div class="conteudo">
      <div class="foto-area">
        <<img src="casal.jpg" alt="Neroci e Vanessa">>
      </div>

      <div class="info-area">
        <div class="subtitulo">CONVITE DE CASAMENTO</div>

        <div class="titulo">
          Neroci <br>&<br> Vanessa
        </div>

        <div class="detalhe">
          📅 21 de Novembro de 2026
        </div>

        <div class="detalhe">
          🕔 17:00
        </div>

        <div class="detalhe">
          📍 Recanto Wollf
          <div class="descricao">
            Cerimônia e Festa no mesmo local.
          </div>
        </div>

        <div class="botoes">
          <button type="button"
                  class="botao botao-localizacao"
                  onclick="window.open('https://maps.app.goo.gl/XsYa17Ck2yia9vxGA', '_blank')">
             📍 VER LOCALIZAÇÃO
          </button>
        </div>

        <div class="qr-areas">
          <div class="qr-box">
            <button type="button"
                    onclick="window.open('https://wa.me/554791424714?text=Olá!%20Quero%20confirmar%20minha%20presença%20no%20casamento%20de%20Neroci%20e%20Vanessa.', '_blank')"
                    style="border:none; background:transparent; padding:0; cursor:pointer; position:relative; z-index:20;">
              <div class="qr-placeholder" style="background:linear-gradient(135deg,#0b5d47,#128C7E); border:3px solid #d7b56d; box-shadow:0 10px 30px rgba(0,0,0,0.18); transition:0.3s ease; cursor:pointer; display:flex; flex-direction:column; gap:14px;">
                <div style="font-size:72px; line-height:1;">💬</div>
                <div style="color:white; font-size:1.3rem; font-weight:bold; letter-spacing:1px; text-align:center;">
                  ABRIR WHATSAPP
                </div>
                <div style="color:#f7e4a8; font-size:1rem; font-weight:bold; text-align:center;">
                  +55 47 9142-4714
                </div>
              </div>
            </button>
            <div class="qr-label">Confirmar Presença</div>
          </div>

          <div class="qr-box">
            <div class="qr-placeholder">
              Espaço para QR Code PIX
            </div>
            <div class="qr-label">Sugestão 200,00</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
