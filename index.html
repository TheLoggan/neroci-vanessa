<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Convite de Casamento - Neroci & Vanessa</title>

<meta property="og:title" content="Convite de Casamento - Neroci & Vanessa">
<meta property="og:description" content="21 de Novembro de 2026 às 17:00 • Recanto Wollf">
<meta property="og:image" content="https://theloggan.github.io/neroci-vanessa/banner-convite.png">
<meta property="og:url" content="https://theloggan.github.io/neroci-vanessa/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#f6f3ee;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  font-family:Arial,sans-serif;
}

.container{
  width:100%;
  max-width:1600px;
}

.convite{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
  background:white;
}

.banner{
  width:100%;
  display:block;
}

.btn-maps{
  position:absolute;
  left:49.1%;
  top:82.2%;
  width:22.2%;
  height:6.2%;
  border-radius:999px;
  z-index:30;
  cursor:pointer;
}

.btn-maps:hover{
  background:rgba(255,255,255,.08);
  box-shadow:0 0 25px rgba(215,181,109,.8);
}

.btn-whatsapp{
  position:absolute;
  left:6.8%;
  top:73%;
  width:17%;
  height:12%;
  z-index:30;
  border-radius:25px;
  cursor:pointer;
}

.btn-whatsapp:hover{
  background:rgba(255,255,255,.08);
  box-shadow:0 0 25px rgba(215,181,109,.8);
}

.contador-box{
  margin-top:20px;
  background:linear-gradient(135deg,#ffffff,#fbf7ef);
  border:2px solid #d7b56d;
  border-radius:25px;
  padding:20px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.contador-titulo{
  color:#0b5d47;
  font-size:28px;
  font-family:Georgia,serif;
  margin-bottom:18px;
  font-weight:bold;
}

.contador{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}

.tempo{
  min-width:95px;
  padding:14px 10px;
  border-radius:18px;
  background:linear-gradient(135deg,#0b5d47,#145c49);
  border:2px solid #d7b56d;
  color:white;
}

.tempo strong{
  display:block;
  font-size:30px;
  line-height:1;
}

.tempo span{
  display:block;
  margin-top:5px;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
}
</style>
</head>

<body>
<main class="container">

  <div class="convite">
    <img src="banner-convite.png" class="banner" alt="Convite Casamento">

    <a class="btn-maps"
       href="https://maps.app.goo.gl/XsYa17Ck2yia9vxGA"
       target="_blank"
       aria-label="Ver localização"></a>

    <a class="btn-whatsapp"
       href="https://wa.me/554791424714?text=Olá!%20Quero%20confirmar%20minha%20presença%20no%20casamento."
       target="_blank"
       aria-label="WhatsApp"></a>
  </div>

  <section class="contador-box">
    <div class="contador-titulo">Faltam para o casamento</div>

    <div class="contador">
      <div class="tempo"><strong id="dias">0</strong><span>Dias</span></div>
      <div class="tempo"><strong id="horas">0</strong><span>Horas</span></div>
      <div class="tempo"><strong id="minutos">0</strong><span>Minutos</span></div>
      <div class="tempo"><strong id="segundos">0</strong><span>Segundos</span></div>
    </div>
  </section>

</main>

<script>
const dataCasamento = new Date("2026-11-21T17:00:00-03:00").getTime();

function atualizarContador(){
  const agora = new Date().getTime();
  const distancia = dataCasamento - agora;

  if(distancia <= 0){
    document.querySelector(".contador-titulo").innerHTML = "Chegou o grande dia!";
    return;
  }

  document.getElementById("dias").innerHTML =
    Math.floor(distancia / (1000 * 60 * 60 * 24));

  document.getElementById("horas").innerHTML =
    Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

  document.getElementById("minutos").innerHTML =
    Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));

  document.getElementById("segundos").innerHTML =
    Math.floor((distancia % (1000 * 60)) / 1000);
}

atualizarContador();
setInterval(atualizarContador,1000);
</script>

</body>
</html>
