<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Convite de Casamento - Neroci & Vanessa</title>

<meta property="og:title" content="Convite de Casamento - Neroci & Vanessa">
<meta property="og:description" content="21 de Novembro de 2026 às 17:00 • Recanto Wollf">
<meta property="og:image" content="https://theloggan.github.io/neroci-vanessa/banner-convite.png">
<meta property="og:url" content="https://theloggan.github.io/neroci-vanessa/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f6f3ee;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
}

.container{
    width:100%;
    max-width:1600px;
}

.convite{
    position:relative;
    width:100%;
    overflow:hidden;
    border-radius:30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.18);
    background:white;
}

.banner{
    width:100%;
    display:block;
}

/* BOTÃO MAPS */
.btn-maps{
    position:absolute;
    left:49.1%;
    top:82.2%;
    width:22.2%;
    height:6.2%;
    border-radius:999px;
    z-index:50;
    cursor:pointer;
    transition:0.3s;
}

.btn-maps:hover{
    background:rgba(255,255,255,0.08);
    box-shadow:0 0 25px rgba(215,181,109,0.8);
}

/* WHATSAPP */
.whatsapp-img{
    position:absolute;
    left:2.5%;
    top:48.5%;
    width:27%;
    z-index:60;
    cursor:pointer;
    transition:.3s;
}

.whatsapp-img:hover{
    transform:scale(1.03);
    filter:drop-shadow(0 0 20px rgba(215,181,109,.6));
}

.whatsapp-img img{
    width:100%;
    display:block;
    background:transparent;
}

/* QR PIX */
.pix-area{
    position:absolute;
    right:5.9%;
    top:61.2%;
    width:16.8%;
    z-index:40;
}

.pix-area img{
    width:100%;
    display:block;
    border-radius:4px;
}

/* CONTADOR */
.contador-box{
    margin-top:20px;
    background:linear-gradient(135deg,#fff,#fbf7ef);
    border:2px solid #d7b56d;
    border-radius:25px;
    padding:20px;
    text-align:center;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.contador-titulo{
    color:#0b5d47;
    font-size:28px;
    font-family:Georgia,serif;
    margin-bottom:18px;
    font-weight:bold;
}

.contador{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
}

.tempo{
    min-width:95px;
    padding:14px 10px;
    border-radius:18px;
    background:linear-gradient(135deg,#0b5d47,#145c49);
    border:2px solid #d7b56d;
    color:white;
}

.tempo strong{
    display:block;
    font-size:30px;
}

.tempo span{
    font-size:12px;
    text-transform:uppercase;
}

@media(max-width:900px){

    .whatsapp-img{
        left:1.5%;
        top:50%;
        width:32%;
    }

    .pix-area{
        width:20%;
        right:4%;
        top:62%;
    }

    .contador-titulo{
        font-size:20px;
    }

    .tempo{
        min-width:70px;
    }

    .tempo strong{
        font-size:22px;
    }
}

</style>
</head>

<body>

<main class="container">

<div class="convite">

<img src="banner-convite.png" class="banner" alt="Convite Casamento">

<!-- BOTÃO LOCALIZAÇÃO -->
<a class="btn-maps"
href="https://maps.app.goo.gl/XsYa17Ck2yia9vxGA"
target="_blank"
aria-label="Ver localização"></a>

<!-- WHATSAPP -->
<a class="whatsapp-img"
href="https://wa.me/554791424714?text=Olá!%20Quero%20confirmar%20minha%20presença%20no%20casamento."
target="_blank">

<img src="image(88).png"
alt="Confirmar Presença">

</a>

<!-- QR PIX -->
<div class="pix-area">

<img src="qrcode-pix.png"
alt="QR Code PIX">

</div>

</div>

<!-- CONTADOR -->
<section class="contador-box">

<div class="contador-titulo">
Faltam para o casamento
</div>

<div class="contador">

<div class="tempo">
<strong id="dias">0</strong>
<span>Dias</span>
</div>

<div class="tempo">
<strong id="horas">0</strong>
<span>Horas</span>
</div>

<div class="tempo">
<strong id="minutos">0</strong>
<span>Minutos</span>
</div>

<div class="tempo">
<strong id="segundos">0</strong>
<span>Segundos</span>
</div>

</div>

</section>

</main>

<script>

const dataCasamento =
new Date("2026-11-21T17:00:00-03:00").getTime();

function atualizarContador(){

const agora = new Date().getTime();

const distancia = dataCasamento - agora;

if(distancia <= 0){

document.querySelector(".contador-titulo").innerHTML =
"Chegou o grande dia!";

return;
}

document.getElementById("dias").innerHTML =
Math.floor(distancia / (1000*60*60*24));

document.getElementById("horas").innerHTML =
Math.floor((distancia % (1000*60*60*24)) / (1000*60*60));

document.getElementById("minutos").innerHTML =
Math.floor((distancia % (1000*60*60)) / (1000*60));

document.getElementById("segundos").innerHTML =
Math.floor((distancia % (1000*60)) / 1000);
}

atualizarContador();

setInterval(atualizarContador,1000);

</script>

</body>
</html>
